# Publish agentic-password-injector to npm with provenance, on a version tag.
#
# THREE PREREQUISITES this workflow depends on — each burned a real launch once,
# so they're documented here rather than relearned:
#
#   (a) Provenance requires the GitHub repo to be PUBLIC. `--provenance` fails
#       on a private repo even with a valid OIDC token.
#   (b) Trusted publishing must be pre-registered on npmjs.com BEFORE this
#       workflow can publish without a token: package → Settings → Trusted
#       Publisher → this repo (owner/name) + this workflow filename
#       (publish.yml). A brand-new package name has no npm page yet, so it
#       usually needs one manual `npm publish` (interactive `npm login` +
#       2FA/OTP, run by a human in their own terminal) before the trusted
#       publisher can be wired up at all. CONFIRMED on v0.2.0 (2026-08-26): this
#       step died with `npm error code ENEEDAUTH` on the first-ever tag, and
#       0.2.0 was published by hand — which is why it carries no provenance.
#   (c) A LOCAL `npm publish` can never produce a provenance attestation — it
#       requires the CI/OIDC environment (the `id-token: write` permission
#       below, consumed by npm's OIDC exchange during `npm publish
#       --provenance`). Provenance is only possible from a run like this one.
#
# Bun-only package: no node build step. bun:sqlite/bun:test/direct .ts imports
# have no node equivalent, so the tarball ships the src/ TypeScript as-is and
# is installed/run via bunx/bun, never node.

name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC trusted publishing to npm
  contents: write # gh release create writes a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Refresh npm (trusted publishing needs npm >= 11.5.1)
        run: npm i -g npm@latest

      - name: Check whether this version is already published
        id: version-check
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          PKG_NAME="$(node -p "require('./package.json').name")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with provenance
        if: steps.version-check.outputs.skip != 'true'
        run: npm publish --provenance --access public

      # `!cancelled()` rather than `success()`: a failed npm publish must not also
      # swallow the GitHub Release. v0.2.0 hit exactly that — the package did not
      # exist on npm yet, so no trusted publisher could be registered, so publish
      # died with ENEEDAUTH and this step never ran. The release then had to be
      # created by hand. The two are independent artifacts and should fail
      # independently. `!cancelled()` still skips on a deliberate cancellation.
      - name: Create GitHub Release
        if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
            exit 0
          fi

          VERSION="${TAG#v}"
          NOTES_FILE="$(mktemp)"
          # Pull the matching section out of CHANGELOG.md if present, else
          # fall back to gh's auto-generated notes.
          if [ -f CHANGELOG.md ] && grep -q "## \[$VERSION\]" CHANGELOG.md; then
            awk -v ver="## [$VERSION]" '
              index($0, ver) == 1 { found=1; print; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md > "$NOTES_FILE"
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
